[project]
name = "embodied-formats"
version = "0.1.0"
description = "Low-level anatomy, unified read-only access, and I/O benchmark lab for Embodied AI / VLA dataset formats (MCAP, HDF5, Zarr, RLDS/TFRecord, LeRobot v3.0)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=13.0.0",
    "h5py>=3.12.0",
    "huggingface-hub>=0.26.0",
    "mcap>=1.2.1",
    "numpy>=2.0.0",
    "pillow>=10.4.0",
    "pyarrow>=18.0.0",
    "rich>=13.9.0",
    "zarr>=2.18.0,<3.0.0",
]

[project.scripts]
edlab = "embodied_formats.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embodied_formats"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
